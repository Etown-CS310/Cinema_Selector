<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Library</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Limelight&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
        
    <link rel="stylesheet" href="style.css">
    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <script src="js/movies.js"></script>
    <script src="js/library.js"></script>
</head>

<body>

    <header id="navbar">
        <!-- <h1 id="cinemaSelector">Cinema Selector</h1>
        <div class="nav">
            <a href="index.html">Randomizer</a>
            <a href="history.html">Watch History</a>
            <a href="library.html">My Library</a>
            <a href="preferences.html">My Preferences</a>
        </div> -->
    </header>
    <main class="container py-4">
        <h2>My Movie Library</h2>
        <p class="text-body-secondary">This is where the user can see all their movie options.</p>
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <label class="input-group-text" for="search">Search:</label>
                    <input type="text" id="searchBar" class="form-control" placeholder="Search your movies...">
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <labe class="input-group-text" for="sortMovies">Sort by: </label>
                        <select id="sortMovies" class="form-select">
                            <option value="newest" selected>Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <!-- These could get moved to their own drop downs -->
                            <optgroup label="By Genre">
                                <option value="action">Action</option>
                                <option value="comedy">Comedy</option>
                                <option value="drama">Drama</option>
                                <option value="horror">Horror</option>
                                <option value="romance">Romance</option>
                                <option value="scifi">Sci-Fi</option>
                                <option value="thriller">Thriller</option>
                                <option value="fantasy">Fantasy</option>
                                <option value="family">Family</option>
                            </optgroup>
                            <optgroup label="Rating">
                                <option value="g">G</option>
                                <option value="pg">PG</option>
                                <option value="pg-13">PG-13</option>
                                <option value="r">R</option>
                            </optgroup>
                        </select>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4 text-center">
            <div class="col-12 col-md-4">
                <div class="card stat-card h-100">
                    <div class="card-body">
                        <h3 class="h6 card-subtitle text-body-secondary">Total Number of Movies:</h3>
                        <p class="display-5 fw-bold mb-0" id="totalCount">#</p>
                        <small>Movies in collection</small>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card stat-card h-100">
                    <div class="card-body">
                        <h3 class="h6 card-subtitle text-body-secondary">Total Number of Unwatched Movies:</h3>
                        <p class="display-5 fw-bold mb-0" id="unwatchedCount">#</p>
                        <small>Movies still to watch</small>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card stat-card h-100">
                    <div class="card-body">
                        <h3 class="h6 card-subtitle text-body-secondary">Total Movie Runtime:</h3>
                        <p class="display-5 fw-bold mb-0" id="runtimeTotal">#</p>
                        <small>hours watched</small>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex flex-column gap-3" id="movieList">

        </div>
    </main>

</body>

</html>
