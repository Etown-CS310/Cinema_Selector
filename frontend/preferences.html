<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Limelight&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">

    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <script src="js/preferences.js"></script>
</head>

<body>
    <header id="navbar">
        <!-- <h1 id="cinemaSelector">Cinema Selector</h1>
        <div class="nav">
            <a href="index.html">Randomizer</a>
            <a href="history.html">Watch History</a>
            <a href="library.html">My Library</a>
            <a href="preferences.html">My Preferences</a>
        </div> -->
    </header>

    <main class="container py-4">
        <h2>Movie Preferences</h2>
        <p>This is where the user can update their preferences</p>

        <div class="row g-4">
            <div class="col-12 col-md-4">
                <form class="card pref-card h-100">
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="genre" class="form-label">Favorite Genre:</label>
                            <select id="genre" name="genre" class="form-select">
                                <option value="">--Select a genre--</option>
                                <option value="Action">Action</option>
                                <option value="Comedy">Comedy</option>
                                <option value="Drama">Drama</option>
                                <option value="Horror">Horror</option>
                                <option value="Romance">Romance</option>
                                <option value="Scifi">Sci-Fi</option>
                                <option value="Thriller">Thriller</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="rating" class="form-label">Minimum Rating:</label>
                            <input type="number" id="rating" name="rating" class="form-control" min="0" max="10"
                                step="0.5" placeholder="ex. 7">
                        </div>
                        <div class="form-check mb-4">
                            <label class="form-check-label" for="'familyFriendly">Family Friendly Movies Only:</label>
                            <input class="form-check-input" type="checkbox" id="familyFriendly" name="family-friendly">
                        </div>

                        <button type="submit" class="btn btn-primary rounded-pill px-4">Update Preferences</button>
                    </div>
                </form>

            </div>
            <div class="col-12 col-md-4">
                <div class="card pref-card h-100">
                    <div class="card-body">
                        <h2 class="h4">My Preferences</h2>
                        <h3 class="h6 mt-3">Minimum Rating: <span id="minRating">4</span>/10</h3>
                        <h3 class="h6 mt-4">Favorite Genres:</h3>
                        <ul class="favGenres list-group list-group-flush">
                            <li class="movieGenre list-group-item bg-transparent">Action</li>
                            <li class="movieGenre list-group-item bg-transparent">Comedy</li>
                            <li class="movieGenre list-group-item bg-transparent">Romance</li>
                        </ul>
                        <h3 class="h6 mt-4">Family Friendly Only: <span id="fam">On</span></h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card pref-card h-100">
                    <div class="card-body">
                        <h2 class="h4">Blocked Movies</h2>
                        <p class="mb-0">These will not appear in you search.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
