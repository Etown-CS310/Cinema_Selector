<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch History</title>

    <!-- bootstrap (a big CSS file used for pre-named classes) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- font awesome (additional UI tool, used for the search icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">


    <script src="movies.js" defer></script>
    <script src="random.js" defer></script>
    <script src="history.js" defer></script>
</head>

<body>
    <header>
        <h1 id="cinemaSelector">Cinema Selector</h1>
        <div class="nav">
            <a href="index.html">Randomizer</a>
            <a href="history.html">Watch History</a>
            <a href="library.html">My Library</a>
            <a href="preferences.html">My Preferences</a>
        </div>
    </header>

    <!-- bootstrap's outer wrapper class- center content and adds padding/margins -->
    <div class="container">
        <h2>Watch History</h2>
        <p>Movies you've already watched.</p>

        <!-- flex container: horizontal, spacing, alignment -->
        <!-- below in lines 40, 49, and 63 is the grid columns -->
        <div class="row g-2 align-items-end mb-4">
            <div class="col-md-5">
                <label for="search" class="form-label">Search</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>

                    <input type="text" id="search" class="form-control" placeholder="Search movies...">
                </div>
            </div>

            <div class="col-md-3">
                <label for="genre" class="form-label">Genre</label>
                <select id="genre" class="form-select">
                    <option value="all">All Genres</option>
                    <option value="action">Action</option>
                    <option value="comedy">Comedy</option>
                    <option value="drama">Drama</option>
                    <option value="horror">Horror</option>
                    <option value="romance">Romance</option>
                    <option value="scifi">Sci-Fi</option>
                    <option value="thriller">Thriller</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="sort" class="form-label">Sort</label>
                <select id="sort" class="form-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
        </div>

        <div id="history-container" class="row"></div>

    </div>

</body>

</html>
